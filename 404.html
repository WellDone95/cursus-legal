<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursus</title>
<script>
(function () {
  var p = location.pathname;
  if (/^\/(e|l|u|squadra\/r)\/[^/]+\/?$/.test(p)) {
    if ((/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))) {
      location.replace('/iphone/?da=' + encodeURIComponent(p.replace(/^\//, '')));
      return;
    }
    location.replace('https://play.google.com/store/apps/details?id=it.edufacile.cursus&referrer=' + encodeURIComponent(p.replace(/^\//, '')));
  }
})();
</script><style>:root{--bg:#F1F3F5;--carta:#fff;--ink:#1B2621;--ink2:#4A5650;--verde:#0A7D45;--scuro:#0B3D26;--linea:#E3E6E9}
@media(prefers-color-scheme:dark){:root{--bg:#0E1512;--carta:#16201B;--ink:#E8EFEA;--ink2:#A9B7AF;--verde:#5FD79A;--linea:#25322B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{background:var(--scuro);color:#fff;padding:20px 16px}header a{color:#fff;text-decoration:none;font-weight:800;font-size:20px}header span{opacity:.75;font-weight:500;font-size:14px;margin-left:8px}
main{max-width:720px;margin:24px auto;padding:28px 22px;background:var(--carta);border:1px solid var(--linea);border-radius:18px}
@media(max-width:760px){main{margin:0;border-radius:0;border-left:0;border-right:0}}
h1{font-size:28px;line-height:1.2;margin:0 0 8px}h2{font-size:20px;margin:32px 0 8px}p,li{color:var(--ink2)}strong{color:var(--ink)}a{color:var(--verde)}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px;display:block;overflow-x:auto}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:top}th{color:var(--ink)}
nav{max-width:720px;margin:0 auto;padding:16px 22px 40px;font-size:15px}nav a{display:inline-block;margin:0 16px 8px 0}</style></head><body>
<header><a href="/">Cursus</a><span>di EduFacile</span></header>
<main><p>Questa pagina non c’è. Cursus si apre dall’app: <a href="https://play.google.com/store/apps/details?id=it.edufacile.cursus">Cursus sul Play Store</a>. Su iPhone non c’è ancora: <a href="/iphone/">chi la aspetta può lasciare l’email</a>.</p></main>
</body></html>
